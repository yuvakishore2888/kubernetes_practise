---
apiVersion: v1
kind: Pod
metadata:
  name: pod-4
  labels:
    app: zomato
spec:
  containers:
    - name: cont-1
      image: nginx
      ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: service2
spec:
  type: NodePort
  selector:
    app: zomato
  ports:
    - port: 80
      targetPort: 80
      nodePort: 32500

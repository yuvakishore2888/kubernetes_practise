---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment
  labels: 
    env: dev
spec:
  replicas: 3
  selector:
    matchLabels:
      env: dev
  template:
    metadata:
      labels:
        env: dev
    spec:
      containers:
        - name: cont-1
          image: nginx
          ports: 
            - containerPort: 80
